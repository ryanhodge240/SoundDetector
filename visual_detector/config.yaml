name: Visual Detector
version: "0.1.2"
slug: visual_detector
description: Detect people from a USB webcam and optionally send state changes over Tailscale.
arch:
    - aarch64
startup: application
boot: auto
init: false
video: true
options:
    camera_device: /dev/video0
    camera_width: 640
    camera_height: 480
    detection_interval_seconds: 2
    confidence_threshold: 0.65
    confirm_frames: 2
    clear_frames: 5
    server_url: ""
    server_token: ""
    dry_run: true
    save_debug_frame: false
    log_level: info
schema:
    camera_device: str
    camera_width: int(160,)
    camera_height: int(120,)
    detection_interval_seconds: float(0.5,)
    confidence_threshold: float(0,1)
    confirm_frames: int(1,)
    clear_frames: int(1,)
    server_url: str?
    server_token: password?
    dry_run: bool
    save_debug_frame: bool
    log_level: list(debug|info|warning|error)
